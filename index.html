<html lang="en">

<meta name="theme-color" content="#7c5cff" />
<script>
  (function () {
    try {
      var t = localStorage.getItem("minutes-theme");
      if (t !== "dark" && t !== "light") {
        t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>
<style>
  :root {
    color-scheme: dark;
    --radius: 16px;
    --nav-h: 68px;
    /* identity + status colors (shared across themes) */
    --accent: #7c5cff;
    --accent-2: #34d399;
    --danger: #ff5c7c;
    /* chrome - Minimal Dark (default) */
    --bg: #14162b;
    --card: #191c33;
    --card-2: #202443;
    --text: #eef0ff;
    --muted: #9aa0c8;
    --muted-2: #5a6296;
    --border: #23284a;
    --border-2: #2c3159;
    --tint-accent: rgba(124,92,255,0.20);
    --tint-accent-fg: var(--tint-accent-fg);
    --tint-danger: var(--tint-danger);
    --tile-accent-bg: #241f52;
    --tile-accent-bd: #3a2f88;
    --note-fg: #ffc2ce;
    --note-bg: rgba(255,92,124,0.10);
    --note-bd: #6a2a38;
    --toast-bg: #2a3057;
    --toast-bd: #3a4173;
    --toast-bd-ok: #2f6b52;
    --nav-bg: rgba(18,20,40,0.92);
    --overlay: rgba(6,8,20,0.62);
    --motiv-lead: #ffe4ad;
    --motiv-warn: #ffc2ce;
    --motiv-climb: #d7ccff;
    --motiv-zero: #bfe8fb;
    --chart-grid: #23284a;
    --chart-grid-2: #20264a;
    --chart-node-ring: #14162b;
    --shadow-pop: 0 18px 44px -14px rgba(0,0,0,.7);
    --shadow-toast: 0 14px 34px -12px rgba(0,0,0,.65);
    --shadow-modal: 0 24px 60px -18px rgba(0,0,0,.7);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f4f5fa;
    --card: #ffffff;
    --card-2: #f0f1f7;
    --text: #1c1e2e;
    --muted: #6b7194;
    --muted-2: #a2a7c0;
    --border: #e6e8f2;
    --border-2: #dfe2ee;
    --tint-accent: rgba(124,92,255,0.14);
    --tint-accent-fg: #6746c9;
    --tint-danger: rgba(255,92,124,0.12);
    --tile-accent-bg: #efeaff;
    --tile-accent-bd: #ddd2fb;
    --note-fg: #b3243f;
    --note-bg: rgba(255,92,124,0.10);
    --note-bd: #f2ccd3;
    --toast-bg: #ffffff;
    --toast-bd: #e6e8f2;
    --toast-bd-ok: #bfe6d2;
    --nav-bg: rgba(255,255,255,0.92);
    --overlay: rgba(30,34,70,0.28);
    --motiv-lead: #b26a00;
    --motiv-warn: #c0344d;
    --motiv-climb: #6b4fd0;
    --motiv-zero: #1d84b5;
    --chart-grid: #e6e8f2;
    --chart-grid-2: #eef0f6;
    --chart-node-ring: #ffffff;
    --shadow-pop: 0 18px 44px -14px rgba(30,34,70,.18);
    --shadow-toast: 0 14px 34px -12px rgba(30,34,70,.16);
    --shadow-modal: 0 24px 60px -18px rgba(30,34,70,.22);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 0; }

  /* ---- Login ---- */
  #login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  .login-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px 22px; text-align: center; }
  .login-card .logo { font-size: 40px; margin-bottom: 8px; }
  .login-card h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.5px; }
  .login-card p { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .login-card input {
    width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border-2);
    background: var(--card-2); color: var(--text); font-size: 16px; outline: none; text-align: center; margin-bottom: 12px;
  }
  .login-card input:focus { border-color: var(--accent); }
  .login-err { color: var(--danger); font-size: 13px; min-height: 0; margin: 0; }
  .login-err:not(:empty) { margin: 2px 0 6px; }

  /* ---- App ---- */
  #app { display: none; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  header .greet { display: flex; align-items: center; gap: 11px; flex: 1 1 auto; min-width: 0; }
  header .greet-text { min-width: 0; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .sub { font-size: 12px; color: var(--muted); }
  .gear { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; background: var(--card-2); border: 1px solid var(--border-2); color: var(--muted); padding: 9px; border-radius: 12px; cursor: pointer; }
  .gear svg { width: 18px; height: 18px; display: block; }
  .gear:active, .gear.open { background: var(--accent); border-color: var(--accent); color: #fff; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 14px; font-weight: 700; }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card-head h2 { margin: 0; }
  .edit-btn { background: var(--card-2); border: 1px solid var(--border-2); color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
  .edit-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Participant editor */
  .pe-sub { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 700; margin: 14px 0 8px; }
  .pe-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .pe-row:last-of-type { border-bottom: none; }
  .pe-row .dot { width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; }
  .pe-row .nm { flex: 1; font-size: 15px; font-weight: 600; }
  .pe-row .rm { background: none; border: none; color: var(--danger); font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .pe-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .pe-chip { border: 1px solid var(--border-2); background: var(--card-2); color: var(--text); font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 12px; cursor: pointer; }
  .pe-chip:active { background: var(--accent); border-color: var(--accent); }
  .pe-empty { font-size: 12px; color: var(--muted); padding: 2px 0; }
  .pe-add { display: flex; gap: 8px; margin-top: 8px; }
  .pe-add input { flex: 1; min-width: 0; }
  .pe-add button { flex: 0 0 auto; padding: 0 16px; border-radius: 12px; border: 1px solid var(--border-2); background: var(--card-2); color: var(--text); font-weight: 600; font-size: 14px; cursor: pointer; }
  .pe-done { width: 100%; padding: 13px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 16px; }
  .pe-err { color: var(--danger); font-size: 12px; min-height: 0; margin-top: 6px; }

  .block-note { font-size: 13px; color: var(--note-fg); background: var(--note-bg); border: 1px solid var(--note-bd); border-radius: 12px; padding: 11px 14px; margin-bottom: 12px; line-height: 1.4; }

  /* Personal stats block */
  .me-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; color: #fff; flex: 0 0 auto; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; position: relative; }
  .tile .label { font-size: 11px; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; min-height: 18px; }
  .tile .label .badge { background: var(--tint-accent); color: var(--tint-accent-fg); font-weight: 800; font-size: 10px; letter-spacing: .6px; padding: 2px 6px; border-radius: 8px; text-transform: uppercase; }
  .tile .value { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
  .tile .value small { font-size: 14px; font-weight: 600; color: var(--muted); }
  .tile.accent { background: var(--tile-accent-bg); border-color: var(--tile-accent-bd); }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input[type=number], input[type=text], input[type=date] {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--border-2);
    background: var(--card-2); color: var(--text); font-size: 16px; outline: none;
  }
  input:focus { border-color: var(--accent); }

  /* Custom date field */
  .datepick { position: relative; }
  .dp-trigger {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 13px 14px; border-radius: 12px; border: 1px solid var(--border-2);
    background: var(--card-2); color: var(--text); font-size: 16px; cursor: pointer; text-align: left;
  }
  .dp-trigger:focus { border-color: var(--accent); outline: none; }
  .dp-trigger .dp-ic { color: var(--muted); display: flex; }
  .dp-trigger .dp-ic svg { width: 18px; height: 18px; display: block; }
  .cal-pop {
    position: absolute; top: calc(100% + 8px); left: 0; z-index: 30;
    width: 280px; max-width: 86vw; background: var(--card); border: 1px solid var(--border-2);
    border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow-pop);
    opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .18s ease, transform .18s ease;
  }
  .cal-pop.show { opacity: 1; transform: none; pointer-events: auto; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-title { font-size: 14px; font-weight: 700; }
  .cal-nav { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border-2); background: var(--card-2); color: var(--text); font-size: 18px; cursor: pointer; line-height: 1; }
  .cal-nav:active { background: var(--accent); border-color: var(--accent); }
  .cal-nav:disabled { opacity: .4; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-dow-cell { text-align: center; font-size: 10px; font-weight: 700; color: var(--muted); padding: 4px 0; text-transform: uppercase; }
  .cal-cell { aspect-ratio: 1 / 1; border: none; background: none; color: var(--text); font-size: 13px; border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .cal-cell:hover { background: var(--card-2); }
  .cal-cell.blank { visibility: hidden; cursor: default; }
  .cal-cell.future { color: var(--muted-2); cursor: not-allowed; }
  .cal-cell.future:hover { background: none; }
  .cal-cell.today { box-shadow: inset 0 0 0 1px var(--accent); color: var(--tint-accent-fg); }
  .cal-cell.sel { background: var(--accent); color: #fff; font-weight: 700; }
  .cal-cell.sel:hover { background: var(--accent); }
  .cal-foot { margin-top: 10px; }
  .cal-foot button { width: 100%; padding: 9px; border-radius: 9px; border: 1px solid var(--border-2); background: var(--card-2); color: var(--text); font-weight: 600; font-size: 13px; cursor: pointer; }
  .cal-foot button:active { background: var(--accent); border-color: var(--accent); }

  /* Custom minutes stepper - native spinners removed */
  input[type=number] { -webkit-appearance: textfield; -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper { display: flex; gap: 6px; }
  .stepper .step { flex: 0 0 42px; border: 1px solid var(--border-2); background: var(--card-2); color: var(--text); border-radius: 12px; font-size: 22px; font-weight: 500; cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .stepper .step:active { background: var(--accent); border-color: var(--accent); }
  .stepper input { flex: 1 1 auto; width: 100%; min-width: 0; text-align: center; padding-left: 4px; padding-right: 4px; }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .quick button { flex: 1; min-width: 56px; padding: 10px; border-radius: 12px; border: 1px solid var(--border-2); background: var(--card-2); color: var(--text); font-weight: 600; cursor: pointer; font-size: 14px; }
  .quick button:active { background: var(--accent); border-color: var(--accent); }
  .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 6px; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.ok { background: var(--accent-2); }

  /* Chart */
  .chart-wrap { width: 100%; }
  svg { width: 100%; height: auto; display: block; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 12px; }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .leg-item.off { opacity: .4; }
  .leg-item.me { color: var(--text); font-weight: 700; }
  .leg-swatch { width: 12px; height: 12px; border-radius: 4px; flex: 0 0 auto; }

  /* Entries */
  .entry { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .entry:last-child { border-bottom: none; }
  .entry .meta { display: flex; flex-direction: column; gap: 3px; }
  .entry .who { font-weight: 700; font-size: 15px; }
  .entry .det { font-size: 12px; color: var(--muted); }
  .entry .mins { font-weight: 800; font-size: 16px; color: var(--accent-2); }
  .entry .del { background: none; border: none; color: var(--danger); font-size: 18px; cursor: pointer; padding: 4px 8px; margin-left: 6px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 18px 0; }

  /* Entries - month accordion */
  .mgroup { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .mgroup-head { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 14px; background: var(--card-2); border: none; color: var(--text); cursor: pointer; text-align: left; }
  .mgroup-head .mg-title { font-weight: 700; font-size: 15px; display: block; }
  .mgroup-head .mg-sub { font-size: 12px; color: var(--muted); margin-top: 2px; display: block; }
  .mgroup-head .mg-right { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .mgroup-head .mg-total { font-weight: 800; color: var(--accent-2); font-size: 14px; }
  .mg-chev { transition: transform .18s ease; color: var(--muted); font-size: 18px; line-height: 1; }
  .mgroup.open .mg-chev { transform: rotate(90deg); }
  .mgroup-body { padding: 0 14px; display: none; }
  .mgroup.open .mgroup-body { display: block; }

  /* Leaderboard */
  .lb-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
  .lb-row.me .rank { color: var(--text); }
  .lb-row.me .name { font-weight: 800; color: var(--text); }
  .lb-row.me .n { color: var(--text); font-weight: 700; }
  .lb-row .rank { flex: 0 0 16px; text-align: right; font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lb-row .name { flex: 0 0 84px; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-bar { flex: 1; height: 10px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .lb-bar > span { display: block; height: 100%; border-radius: 999px; }
  .lb-row .n { flex: 0 0 auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .seg { display: flex; background: var(--card-2); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
  .seg button { flex: 1; padding: 9px; border: none; background: none; color: var(--muted); font-weight: 700; font-size: 14px; border-radius: 9px; cursor: pointer; }
  .seg button.active { background: var(--accent); color: #fff; }
  .seg button:disabled { opacity: .4; cursor: default; }

  /* Motivational hero line (scope pill + text, auto-cycles today/month) */
  .motiv { display: flex; align-items: flex-start; gap: 9px; width: 100%; text-align: left;
    background: none; border: none; padding: 0 2px; margin: 2px 0 18px; cursor: pointer;
    font-family: inherit; -webkit-tap-highlight-color: transparent; transition: opacity .35s ease; }
  .motiv.fading { opacity: 0; }
  .motiv .motiv-pill { flex: 0 0 auto; margin-top: 1px; font-size: 10px; font-weight: 800;
    letter-spacing: .6px; padding: 2px 7px; border-radius: 8px; text-transform: uppercase; line-height: 1.5; }
  .motiv .motiv-pill.today { background: var(--tint-accent); color: var(--tint-accent-fg); }
  .motiv .motiv-pill.month { background: var(--card-2); color: var(--muted); }
  .motiv .motiv-text { font-size: 14px; font-weight: 600; line-height: 1.5; color: var(--text); }
  .motiv.lead .motiv-text { color: var(--motiv-lead); }
  .motiv.warn .motiv-text { color: var(--motiv-warn); }
  .motiv.climb .motiv-text { color: var(--motiv-climb); }
  .motiv.zero .motiv-text { color: var(--motiv-zero); }
  .motiv.seed .motiv-text, .motiv.past .motiv-text { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .motiv { transition: none; } }

  /* Month carousel */
  .monthbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .mb-nav { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 12px; border: 1px solid var(--border-2); background: var(--card); color: var(--text); font-size: 22px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .mb-nav:disabled { opacity: .4; cursor: default; }
  .mb-nav:not(:disabled):active { background: var(--accent); border-color: var(--accent); }
  .mb-label { flex: 1; text-align: center; background: none; border: none; color: var(--text); font-size: 16px; font-weight: 600; letter-spacing: -.3px; cursor: default; padding: 0 9px; line-height: 40px; border-radius: 12px; }
  .mb-label.past { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 5px; text-decoration-color: var(--muted); }
  .dateheader { display: flex; align-items: center; justify-content: center; height: 40px; margin-bottom: 16px; font-size: 16px; font-weight: 600; letter-spacing: -.3px; color: var(--text); }

  .ver-tag { text-align: center; color: var(--muted); font-size: 11px; opacity: .5; margin-top: 16px; padding-bottom: 4px; }

  /* Admin */
  .member { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .member:last-child { border-bottom: none; }
  .member .dot { width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; }
  .member .mname { flex: 1; font-size: 15px; font-weight: 600; }
  .member .roletoggle { font-size: 10px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border-2); background: var(--card-2); color: var(--muted); cursor: pointer; flex: 0 0 auto; }
  .member .roletoggle.on { background: var(--tint-accent); color: var(--tint-accent-fg); border-color: var(--border-2); }
  .member .del { background: none; border: none; color: var(--danger); font-size: 18px; cursor: pointer; padding: 4px 8px; }

  /* Undo toast */
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%) translateY(18px);
    bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
    z-index: 40; background: var(--toast-bg); border: 1px solid var(--toast-bd);
    display: flex; align-items: center; gap: 16px; padding: 13px 16px;
    border-radius: 12px; box-shadow: var(--shadow-toast);
    opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
    max-width: calc(100% - 32px); overflow: hidden;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast .msg { font-size: 14px; color: var(--text); }
  .toast .undo { background: none; border: none; color: var(--accent-2); font-weight: 800; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: .6px; flex: 0 0 auto; }
  .toast .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--accent); }
  .toast.success .bar { background: var(--accent-2); }
  .toast.success { border-color: var(--toast-bd-ok); }

  /* Confirm modal */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 50; background: var(--overlay); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--border-2);
    border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow-modal);
    transform: translateY(12px) scale(.97); transition: transform .18s ease;
  }
  .modal-overlay.show .modal { transform: none; }
  .modal .m-ico { width: 44px; height: 44px; border-radius: 12px; background: var(--tint-danger); color: var(--danger); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .modal .m-ico.accent { background: var(--tint-accent); color: var(--accent); }
  .modal .m-ico svg { width: 24px; height: 24px; }
  .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; letter-spacing: -.3px; }
  .modal-msg { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; }
  .mbtn { flex: 1; padding: 13px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; border: 1px solid var(--border-2); }
  .mbtn.ghost { background: var(--card-2); color: var(--text); }
  .mbtn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .mbtn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .mbtn:active { transform: scale(.98); }

  /* Tabs */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    height: calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--nav-bg); backdrop-filter: blur(12px);
    border-top: 1px solid var(--border); display: flex;
  }
  nav.tabs button {
    flex: 1; background: none; border: none; color: var(--muted); cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
  }
  nav.tabs button::before {
    content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 64px; height: 3px; border-radius: 0 0 3px 3px;
    background: var(--accent);
    opacity: 0; transition: opacity .15s ease;
  }
  nav.tabs button.active::before { opacity: 1; }
  nav.tabs button .tab-inner { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 18px; }
  nav.tabs button .ico { display: inline-flex; align-items: center; justify-content: center; }
  nav.tabs button .ico svg { width: 23px; height: 23px; display: block; }
  nav.tabs button.active { color: var(--accent); font-weight: 700; }

  /* Settings menu (gear) */
  header { position: relative; }
  .settings-menu {
    position: absolute; top: 48px; right: 0; z-index: 45;
    background: var(--card); border: 1px solid var(--border-2);
    border-radius: 14px; padding: 6px; min-width: 210px;
    box-shadow: var(--shadow-pop);
    opacity: 0; transform: translateY(-6px); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .settings-menu.show { opacity: 1; transform: none; pointer-events: auto; }
  .sm-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px; }
  .sm-label { font-size: 14px; font-weight: 600; color: var(--text); }
  .sm-item { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: none; color: var(--text); cursor: pointer; font-size: 14px; font-weight: 600; padding: 10px 8px; border-radius: 10px; text-align: left; }
  .sm-item:active { background: var(--card-2); }
  .sm-item svg { width: 16px; height: 16px; flex: 0 0 auto; color: var(--muted); }
  .sm-sep { height: 1px; background: var(--border); margin: 4px 6px; }
  .sm-ver { text-align: center; color: var(--muted); font-size: 11px; opacity: .55; padding: 6px 0 3px; }
  /* Sun/moon segmented toggle */
  .theme-toggle { position: relative; display: inline-flex; background: var(--card-2); border: 1px solid var(--border-2); border-radius: 999px; padding: 3px; }
  .theme-toggle .tt-thumb { position: absolute; top: 3px; left: 3px; width: 32px; height: 26px; border-radius: 999px; background: var(--accent); transition: transform .2s ease; }
  [data-theme="light"] .theme-toggle .tt-thumb { transform: translateX(0); }
  [data-theme="dark"] .theme-toggle .tt-thumb { transform: translateX(32px); }
  .theme-toggle .tt-opt { position: relative; z-index: 1; width: 32px; height: 26px; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; color: var(--muted); padding: 0; }
  .theme-toggle .tt-opt svg { width: 15px; height: 15px; display: block; }
  [data-theme="light"] .theme-toggle .tt-opt[data-theme-choice="light"] { color: #fff; }
  [data-theme="dark"] .theme-toggle .tt-opt[data-theme-choice="dark"] { color: #fff; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="wrap">
    <div class="login-card">
      <div class="logo">⏱️</div>
      <h1>Minutes</h1>
      <p>Enter your name to open your tracker</p>
      <input type="text" id="loginName" placeholder="Your name" autocomplete="off" autocapitalize="words" />
      <div class="login-err" id="loginErr"></div>
      <button class="btn" id="loginBtn">Continue</button>
    </div>
    <div class="ver-tag"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="wrap">
    <header>
      <div class="greet">
        <div class="me-avatar" id="headAvatar"></div>
        <div class="greet-text">
          <h1>Hi, <span id="meName">you</span> 👋</h1>
          <div class="sub" id="tabSub">Stats</div>

      </div>
      <button class="gear" id="gearBtn" aria-label="Settings" aria-haspopup="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <div class="settings-menu" id="settingsMenu">
        <div class="sm-row">
          <span class="sm-label">Theme</span>
          <div class="theme-toggle" id="themeToggle">
            <span class="tt-thumb"></span>
            <button class="tt-opt" data-theme-choice="light" aria-label="Light theme">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button class="tt-opt" data-theme-choice="dark" aria-label="Dark theme">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
          </div>
        </div>
        <div class="sm-sep"></div>
        <button class="sm-item" id="menuLogout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Log out</span>
        </button>
        <div class="sm-ver" id="menuVer"></div>
      </div>
    </header>

    <!-- STATS TAB -->
    <section class="tab-panel active" id="tab-stats">
      <div class="monthbar">
        <button class="mb-nav" id="monthPrev" aria-label="Previous month">‹</button>
        <button class="mb-label" id="monthLabelTop">Month</button>
        <button class="mb-nav" id="monthNext" aria-label="Next month">›</button>
      </div>

      <div class="statsblock" id="statsblockView"></div>

      <button class="motiv" id="motivation" style="display:none" aria-label="Motivation, tap to switch between today and month">
        <span class="motiv-pill" id="motivPill"></span>
        <span class="motiv-text" id="motivText"></span>
      </button>

      <div class="card">
        <h2>Daily Progress</h2>
        <div class="chart-wrap" id="chart"></div>
        <div class="chart-legend" id="legend"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Leaderboard</h2>
          <button class="edit-btn" id="editParticipants" style="display:none">Edit</button>
        </div>
        <div class="seg" id="seg">
          <button data-range="today" class="active">Today</button>
          <button data-range="month">Month</button>
        </div>
        <div id="leaderboard"></div>
        <div id="participantEdit" style="display:none"></div>
      </div>
    </section>

    <!-- LOG TAB -->
    <section class="tab-panel" id="tab-log">
      <div class="dateheader" id="logDateHeader"></div>
      <div class="statsblock" id="statsblockNow"></div>

      <div class="card">
        <h2>Log your time</h2>
        <div class="row">
          <div class="field">
            <label>Date</label>
            <div class="datepick" id="datepick">
              <button type="button" class="dp-trigger" id="dpTrigger">
                <span id="dpLabel">Today</span>
                <span class="dp-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg></span>
              </button>
              <div class="cal-pop" id="calPop">
                <div class="cal-head">
                  <button type="button" class="cal-nav" id="calPrev">‹</button>
                  <div class="cal-title" id="calTitle"></div>
                  <button type="button" class="cal-nav" id="calNext">›</button>
                </div>
                <div class="cal-grid cal-dow" id="calDow"></div>
                <div class="cal-grid" id="calDays"></div>
                <div class="cal-foot"><button type="button" id="calToday">Today</button></div>
              </div>
            </div>
            <input type="hidden" id="date" />
          </div>
          <div class="field">
            <label for="mins">Minutes</label>
            <div class="stepper">
              <button type="button" class="step" data-step="-5">−</button>
              <input type="number" id="mins" inputmode="numeric" min="0" placeholder="0" />
              <button type="button" class="step" data-step="5">+</button>
            </div>
          </div>
        </div>
        <div class="field">
          <label>Quick add</label>
          <div class="quick">
            <button data-add="15">+15</button>
            <button data-add="30">+30</button>
            <button data-add="45">+45</button>
            <button data-add="60">+60</button>
          </div>
        </div>
        <div class="field">
          <label for="note">Note (optional)</label>
          <input type="text" id="note" placeholder="e.g. Morning run" />
        </div>
        <div class="block-note" id="logBlockNote" style="display:none"></div>
        <button class="btn" id="addBtn">Add entry</button>
      </div>

      <div class="card">
        <h2>Your entries</h2>
        <div id="entries"></div>
      </div>
    </section>

    <!-- ADMIN TAB (admin only) -->
    <section class="tab-panel" id="tab-admin">
      <div class="dateheader" id="adminDateHeader"></div>
      <div class="statsblock" id="statsblockAdmin"></div>

      <div class="card">
        <h2>Members</h2>
        <div id="memberList"></div>
      </div>
      <div class="card">
        <h2>Add member</h2>
        <div class="field">
          <label for="newMember">Name (this is their username &amp; key)</label>
          <input type="text" id="newMember" placeholder="e.g. Morgan" autocomplete="off" autocapitalize="words" />
        </div>
        <div class="login-err" id="memberErr" style="text-align:left"></div>
        <button class="btn" id="addMemberBtn">Add member</button>
      </div>
    </section>

    <div class="ver-tag"></div>
  </div>

  <nav class="tabs">
    <button data-tab="stats" class="active">
      <span class="tab-inner"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 16 9 10 13 14 21 5"/></svg></span><span class="lbl">Stats</span></span></button>
    <button data-tab="log">
      <span class="tab-inner"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span><span class="lbl">Log</span></span></button>
    <button data-tab="admin" id="adminTabBtn" style="display:none">
      <span class="tab-inner"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"/></svg></span><span class="lbl">Admin</span></span></button>
  </nav>

  <div class="toast" id="toast">
    <span class="msg" id="toastMsg"></span>
    <button class="undo" id="toastUndo">Undo</button>
    <span class="bar" id="toastBar"></span>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <div class="m-ico" id="confirmIco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></div>
      <div class="modal-title" id="confirmTitle">Delete?</div>
      <div class="modal-msg" id="confirmMsg"></div>
      <div class="modal-actions">
        <button class="mbtn ghost" id="confirmCancel">Cancel</button>
        <button class="mbtn danger" id="confirmOk">Delete</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var DEFAULT_MEMBERS = ["Gerli", "Kairi", "Matis", "Rando", "Raido"];
  var DEFAULT_ADMINS = ["Rando", "Matis"];
  var PALETTE = ["#7c5cff", "#34d399", "#ffb454", "#ff5c7c", "#38bdf8", "#f472d0",
                 "#a3e635", "#fb923c", "#22d3ee", "#c084fc", "#f87171", "#4ade80"];
  var SESSION_KEY = "minutes_session_v3";
  var ADMINSESS_KEY = "minutes_adminsess_v1";
  var VERSION = "5.5";

  // In-memory cache - the UI's source of truth; kept in sync by Store (Firestore).
  var cache = { members: DEFAULT_MEMBERS.slice(), admins: DEFAULT_ADMINS.slice() };
  var challengesCache = {}; // "YYYY-MM" -> [participant names]

  function members() { return cache.members.slice(); }
  function admins() { return cache.admins.slice(); }
  function isAdmin(name) { return cache.admins.some(function (a) { return a.toLowerCase() === String(name).toLowerCase(); }); }
  // Current user wields admin powers only if they signed in with the admin gesture AND are still an admin.
  function meIsAdmin() { return !!state.me && state.isAdminSession && isAdmin(state.me); }
  function colorFor(name) { var idx = cache.members.indexOf(name); if (idx < 0) idx = 0; return PALETTE[idx % PALETTE.length]; }

  // Participants for a month: explicit challenge doc, else inherit the most recent
  // prior defined month, else fall back to the full member roster (first-run bootstrap).
  function entryAuthorsForMonth(key) {
    var seen = {}, order = [];
    state.entries.forEach(function (e) {
      if (e.date.indexOf(key) === 0 && !seen[e.who]) { seen[e.who] = 1; order.push(e.who); }
    });
    return order;
  }
  function participantsFor(dateOrKey) {
    var key = typeof dateOrKey === "string" ? dateOrKey : monthKeyOf(dateOrKey);
    if (challengesCache[key]) return challengesCache[key].slice();
    // Past month with no explicit challenge: use who actually logged (stable history,
    // so adding a new member later never retroactively appears in old months).
    if (key < monthKeyOf(new Date())) {
      var authors = entryAuthorsForMonth(key);
      if (authors.length) return authors;
    }
    // Current / future (or an empty past month): inherit the most recent defined month, else the roster.
    var prior = Object.keys(challengesCache).filter(function (k) { return k < key; }).sort();
    if (prior.length) return challengesCache[prior[prior.length - 1]].slice();
    return members();
  }
  function isParticipant(name, dateOrKey) {
    return participantsFor(dateOrKey).some(function (p) { return p.toLowerCase() === String(name).toLowerCase(); });
  }
  // Admins may edit the previous, current, and next month's roster.
  function monthEditable(dateObj) {
    var now = new Date();
    var prev = new Date(now.getFullYear(), now.getMonth() - 1, 1).getTime();
    var cur = firstOfMonth(now).getTime();
    var next = new Date(now.getFullYear(), now.getMonth() + 1, 1).getTime();
    var d = firstOfMonth(dateObj).getTime();
    return d === prev || d === cur || d === next;
  }
  // Logging is allowed for the current month and the previous one; older months are closed.
  function logWindowStart() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth() - 1, 1); }
  // Earliest month you can browse: the first month with any data or a challenge (else this month).
  function minNavMonth() {
    var minKey = monthKeyOf(new Date());
    state.entries.forEach(function (e) { var k = e.date.slice(0, 7); if (k < minKey) minKey = k; });
    Object.keys(challengesCache).forEach(function (k) { if (k < minKey) minKey = k; });
    return new Date(+minKey.slice(0, 4), (+minKey.slice(5, 7)) - 1, 1);
  }
  function keyToDate(k) { return new Date(+k.slice(0, 4), (+k.slice(5, 7)) - 1, 1); }
  function nextMonthKey() { var n = new Date(); return monthKeyOf(new Date(n.getFullYear(), n.getMonth() + 1, 1)); }
  // Every month key from the group's earliest through the current month.
  // Admins can always reach the previous month too (it's editable), even with no data yet.
  function allMonthKeysToCurrent() {
    var start = firstOfMonth(minNavMonth());
    if (meIsAdmin()) {
      var n = new Date();
      var prev = new Date(n.getFullYear(), n.getMonth() - 1, 1);
      if (prev.getTime() < start.getTime()) start = prev;
    }
    var keys = [], d = start, cur = firstOfMonth(new Date());
    while (d.getTime() <= cur.getTime()) { keys.push(monthKeyOf(d)); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
    return keys;
  }
  // Months the signed-in user may browse. Admins: all + next. Others: only ones they're in, + next.
  function viewableMonthKeys() {
    var admin = meIsAdmin();
    var base = allMonthKeysToCurrent();
    var list = admin ? base.slice() : base.filter(function (k) { return isParticipant(state.me, k); });
    list.push(nextMonthKey());
    return list;
  }
  // The month a user lands on: their latest viewable month at or before now (else the only one, next).
  function defaultViewKey() {
    var list = viewableMonthKeys(), todayKey = monthKeyOf(new Date());
    var cands = list.filter(function (k) { return k <= todayKey; });
    return cands.length ? cands[cands.length - 1] : list[list.length - 1];
  }
  function clampViewMonth() {
    if (!state.me) return;
    if (viewableMonthKeys().indexOf(monthKeyOf(state.viewMonth)) < 0) state.viewMonth = keyToDate(defaultViewKey());
  }

  var state = { me: null, entries: [], lbRange: "today", hidden: {}, viewMonth: firstOfMonth(new Date()), openMonths: {}, editing: false, isAdminSession: false };
  var rosterLoaded = false;
  var netReady = false; // true once we've received real data from the server (not just cache)
  function requireConnection() {
    if (netReady) return true;
    showToast("Not connected. Your change wasn't saved — reconnect and try again.", null);
    return false;
  }

  function seedData() {
    var demo = [];
    function add(name, ym, dayMins) {
      dayMins.forEach(function (pair) {
        if (pair[1] > 0) demo.push({ id: uid(), who: name, date: ym + "-" + pad(pair[0]), mins: pair[1], note: "" });
      });
    }
    // August 2026 - real numbers from the shared sheet (days 1-6)
    var augCols = {
      Gerli: [192, 299, 90, 69, 120, 156],
      Kairi: [0, 106, 73, 69, 0, 31],
      Matis: [90, 233, 110, 60, 137, 0],
      Rando: [0, 0, 35, 70, 90, 0],
      Raido: [0, 31, 0, 0, 0, 120]
    };
    Object.keys(augCols).forEach(function (name) {
      add(name, "2026-08", augCols[name].map(function (m, i) { return [i + 1, m]; }));
    });

    return demo;
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function todayStr() { return iso(new Date()); }
  function firstOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
  function monthKeyOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1); }
  function isCurrentMonth(d) { var n = new Date(); return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth(); }
  function niceDate(s) { var p = s.split("-"); return new Date(+p[0], (+p[1]) - 1, +p[2]).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }); }

  // ---- Login ----
  function resolveName(input) {
    var q = (input || "").trim().toLowerCase();
    var list = members();
    for (var i = 0; i < list.length; i++) {
      if (list[i].toLowerCase() === q) return list[i];
    }
    return null;
  }

  function doLogin(name, adminMode) {
    state.me = name;
    state.isAdminSession = !!adminMode && isAdmin(name);
    // reset per-user view state so nothing leaks between sessions on a shared device
    state.editing = false; state.hidden = {}; state.openMonths = {}; state.lbRange = "today";
    state.viewMonth = firstOfMonth(new Date());
    localStorage.setItem(SESSION_KEY, name);
    if (state.isAdminSession) localStorage.setItem(ADMINSESS_KEY, "1"); else localStorage.removeItem(ADMINSESS_KEY);
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("meName").textContent = name;
    var av = document.getElementById("headAvatar");
    av.textContent = name.charAt(0).toUpperCase();
    av.style.background = colorFor(name);
    setDate(todayStr());
    document.getElementById("adminTabBtn").style.display = meIsAdmin() ? "flex" : "none";
    state.viewMonth = keyToDate(defaultViewKey());
    switchTab("stats");
    renderAll();
    window.scrollTo(0, 0);
  }

  function doLogout() {
    state.me = null;
    state.isAdminSession = false;
    localStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(ADMINSESS_KEY);
    document.getElementById("app").style.display = "none";
    document.getElementById("login").style.display = "block";
    document.getElementById("loginName").value = "";
    document.getElementById("loginErr").textContent = "";
  }

  document.getElementById("loginBtn").onclick = function () {
    var raw = document.getElementById("loginName").value.trim();
    // Exact member match logs in as a regular user (even for admins).
    var direct = resolveName(raw);
    if (direct) { doLogin(direct, false); return; }
    // Admin gesture: name followed by "a" (e.g. "Matisa" or "Matis a") grants admin powers.
    if (/a$/i.test(raw)) {
      var base = resolveName(raw.replace(/\s*a$/i, "").trim());
      if (base && isAdmin(base)) { doLogin(base, true); return; }
    }
    document.getElementById("loginErr").textContent = (!rosterLoaded && raw)

  function statsHtml(monthDate) {

    var mKey = monthKeyOf(monthDate), t = todayStr();

    myEntries().forEach(function (e) {

      if (e.date === t) todayTotal += e.mins;
    });
    var monthName = monthDate.toLocaleString(undefined, { month: "long" });
    var tile1label = isCur ? "Today" : (isFuture ? "Upcoming" : "Best day");

  function daysAgo(dateStr) {

  // ---- Multi-line cumulative chart (all friends) ----
  function chartColors() {
    var s = getComputedStyle(document.documentElement);
    return {
      grid: s.getPropertyValue("--chart-grid").trim(),
      grid2: s.getPropertyValue("--chart-grid-2").trim(),
      ring: s.getPropertyValue("--chart-node-ring").trim(),
      label: s.getPropertyValue("--muted").trim(),
      sub: s.getPropertyValue("--muted-2").trim()
    };
  }

  function renderChart() {
    var vm = state.viewMonth;
    var isCur = isCurrentMonth(vm);
    var mp = monthKeyOf(vm);
    var lastDay = isCur ? new Date().getDate() : new Date(vm.getFullYear(), vm.getMonth() + 1, 0).getDate();
    var maxDay = Math.max(lastDay, 2);

    // build cumulative series per participant
    var roster = participantsFor(vm);
    var series = {}; // name -> array of {day,val}
    var globalMax = 10;
    var anyData = false;
    roster.forEach(function (name) {
      var perDay = {};
      state.entries.forEach(function (e) {
        if (e.who === name && e.date.indexOf(mp) === 0) {
          var day = parseInt(e.date.slice(8, 10), 10);
          perDay[day] = (perDay[day] || 0) + e.mins;
        }
      });
      var pts = [], cum = 0;
      for (var d = 1; d <= lastDay; d++) { cum += (perDay[d] || 0); pts.push({ day: d, val: cum }); }
      series[name] = pts;
      if (cum > 0) anyData = true;
      if (!state.hidden[name] && cum > globalMax) globalMax = cum;
    });

    // Nobody logged anything this month → show a sleepy illustration instead of flat zero lines
    if (!anyData) {
      document.getElementById("chart").innerHTML = sleepyChartSvg();
      document.getElementById("legend").innerHTML = "";
      return;
    }

    var W = 448, H = 200, PL = 34, PR = 12, PT = 12, PB = 22;
    var innerW = W - PL - PR, innerH = H - PT - PB;
    var C = chartColors();

    function x(day) { return PL + (maxDay === 1 ? 0 : (day - 1) / (maxDay - 1) * innerW); }
    function y(val) { return PT + innerH - (val / globalMax) * innerH; }

    var yTicks = [0, Math.round(globalMax / 2), globalMax];
    var grid = "";
    yTicks.forEach(function (tv) {
      var yy = y(tv);
      grid += '<line x1="' + PL + '" y1="' + yy + '" x2="' + (W - PR) + '" y2="' + yy + '" stroke="' + C.grid + '" stroke-width="1"/>';
      grid += '<text x="' + (PL - 6) + '" y="' + (yy + 3) + '" text-anchor="end" font-size="9" fill="' + C.label + '">' + tv + '</text>';
    });

    // x-axis calendar day labels - only as many as comfortably fit
    var minSpacingPx = 26;
    var maxLabels = Math.max(2, Math.floor(innerW / minSpacingPx));
    var step = Math.max(1, Math.ceil(maxDay / maxLabels));
    var xdays = [];
    for (var dd = 1; dd <= lastDay; dd += step) { xdays.push(dd); }
    if (xdays[xdays.length - 1] !== lastDay) xdays.push(lastDay);
    xdays.forEach(function (dnum) {
      var xx = x(dnum);
      grid += '<line x1="' + xx.toFixed(1) + '" y1="' + PT + '" x2="' + xx.toFixed(1) + '" y2="' + (PT + innerH) + '" stroke="' + C.grid2 + '" stroke-width="1"/>';
      grid += '<text x="' + xx.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9" fill="' + C.label + '">' + dnum + '</text>';
    });

    var lines = "";
    // draw others first, me last (on top)
    var order = roster.filter(function (n) { return n !== state.me; }).concat(state.me ? [state.me] : []);
    order.forEach(function (name) {
      if (state.hidden[name]) return;
      var pts = series[name]; if (!pts || !pts.length) return;
      if (pts[pts.length - 1].val === 0) return; // skip flat zero lines (no data for this member)
      var isMe = name === state.me;
      var path = "";
      pts.forEach(function (p, i) { path += (i === 0 ? "M" : "L") + x(p.day).toFixed(1) + " " + y(p.val).toFixed(1) + " "; });
      lines += '<path d="' + path + '" fill="none" stroke="' + colorFor(name) + '" stroke-width="' + (isMe ? 3.2 : 2) +
               '" stroke-linejoin="round" stroke-linecap="round" opacity="' + (isMe ? 1 : 0.85) + '"/>';
      var last = pts[pts.length - 1];
      lines += '<circle cx="' + x(last.day).toFixed(1) + '" cy="' + y(last.val).toFixed(1) + '" r="' + (isMe ? 4 : 3) +
               '" fill="' + colorFor(name) + '" stroke="' + C.ring + '" stroke-width="1.5"/>';
    });

    var svg =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img">' +
      grid + lines + '</svg>';
    document.getElementById("chart").innerHTML = svg;

    renderLegend();
  }

  function sleepyChartSvg() {
    var C = chartColors();
    var isFuture = state.viewMonth.getTime() > firstOfMonth(new Date()).getTime();
    var l1 = isFuture ? "This challenge hasn't started yet" : "No minutes on the board yet";
    var l2 = isFuture ? "Minutes will show up here once it does" : "Log some time to kick it off";
    return '<svg viewBox="0 0 448 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="No data">' +
      '<text x="224" y="98" text-anchor="middle" font-size="15" fill="' + C.label + '" font-weight="600">' + l1 + '</text>' +
      '<text x="224" y="120" text-anchor="middle" font-size="12" fill="' + C.sub + '">' + l2 + '</text>' +
      '</svg>';
  }

  function renderLegend() {

  function renderEntries() {
    var el = document.getElementById("entries");
    var mine = myEntries();
    if (!mine.length) { el.innerHTML = '<div class="empty">No entries yet. Log your first above.</div>'; return; }
    var groups = {};
    mine.forEach(function (e) { var k = e.date.slice(0, 7); (groups[k] = groups[k] || []).push(e); });
    var keys = Object.keys(groups).sort().reverse();
    var curKey = monthKeyOf(new Date());
    el.innerHTML = "";
    keys.forEach(function (k) {
      var list = groups[k].slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
      var total = list.reduce(function (s, e) { return s + e.mins; }, 0);
      var days = list.length;
      var isOpen = state.openMonths.hasOwnProperty(k) ? state.openMonths[k] : (k === curKey);
      var d = new Date(+k.slice(0, 4), (+k.slice(5, 7)) - 1, 1);

        '<span class="mg-right"><span class="mg-total">' + total + 'm</span><span class="mg-chev">›</span></span>';
      head.onclick = function () { state.openMonths[k] = !isOpen; renderEntries(); };
      wrap.appendChild(head);

      var body = document.createElement("div"); body.className = "mgroup-body";

  // ---- Motivational hero line (auto-cycles today / month) ----
  var motivTimer = null;
  var motivView = { scopes: [], idx: 0 };

  function rangeArr(range) {
    var t = todayStr(), mp = monthKeyOf(state.viewMonth);
    var roster = participantsFor(state.viewMonth);
    var totals = {};
    roster.forEach(function (n) { totals[n] = 0; });
    state.entries.forEach(function (e) {
      var inRange = range === "today" ? e.date === t : e.date.indexOf(mp) === 0;
      if (inRange && totals.hasOwnProperty(e.who)) totals[e.who] += e.mins;
    });
    return roster.map(function (n) { return { name: n, mins: totals[n] }; })
                 .sort(function (a, b) { return b.mins - a.mins; });
  }

  function renderMotiv() {
    if (motivTimer) { clearInterval(motivTimer); motivTimer = null; }
    var mEl = document.getElementById("motivation");
    var isCur = isCurrentMonth(state.viewMonth);
    var isFuture = state.viewMonth.getTime() > firstOfMonth(new Date()).getTime();
    var scopes = [];
    if (state.me && !isFuture) {
      var monthName = state.viewMonth.toLocaleString(undefined, { month: "long" });
      if (isCur) {
        var mT = motivationFor(rangeArr("today"), true);
        if (mT) scopes.push({ label: "Today", pill: "today", cls: mT.cls, text: mT.text });
        var mM = motivationFor(rangeArr("month"), true);
        if (mM) scopes.push({ label: monthName, pill: "month", cls: mM.cls, text: mM.text });
        // avoid cycling two identical lines (e.g. brand-new month with an empty board)
        if (scopes.length === 2 && scopes[0].text === scopes[1].text) scopes.pop();
      } else {
        var mP = motivationFor(rangeArr("month"), false);
        if (mP) scopes.push({ label: monthName, pill: "month", cls: mP.cls, text: mP.text });
      }
    }
    motivView.scopes = scopes;
    if (!scopes.length) { mEl.style.display = "none"; return; }
    if (motivView.idx >= scopes.length) motivView.idx = 0;
    mEl.style.display = "flex";
    paintMotiv(motivView.idx, false);
    if (scopes.length > 1) motivTimer = setInterval(flipMotiv, 7000);
  }

  function paintMotiv(i, animate) {
    var s = motivView.scopes[i];
    if (!s) return;
    var mEl = document.getElementById("motivation");
    var pill = document.getElementById("motivPill");
    var txt = document.getElementById("motivText");
    var apply = function () {
      mEl.className = "motiv " + s.cls;
      pill.className = "motiv-pill " + s.pill;
      pill.textContent = s.label;
      txt.textContent = s.text;
    };
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (animate && !reduce) {
      mEl.classList.add("fading");
      setTimeout(function () { apply(); mEl.classList.remove("fading"); }, 350);
    } else {
      apply();
    }
  }

  function flipMotiv() {
    if (motivView.scopes.length < 2) return;
    motivView.idx = (motivView.idx + 1) % motivView.scopes.length;
    paintMotiv(motivView.idx, true);
  }

  function pickDaily(list) { return list[Math.floor(Date.now() / 86400000) % list.length]; }

  function motivationFor(arr, isCur) {
    var me = state.me;

        else cache.admins = admins().filter(function (n) { return n.toLowerCase() !== name.toLowerCase(); });
      }, name + (becomingAdmin ? " is now an admin" : " is now a member"), function () {
        commitRoster(function () {
          if (becomingAdmin) cache.admins = admins().filter(function (n) { return n.toLowerCase() !== name.toLowerCase(); });
          else cache.admins = admins().concat([name]);
        }, null, null);
      });
    });
  }

  function renderMembers() {
    var el = document.getElementById("memberList");
    var list = members();
    el.innerHTML = "";
    list.forEach(function (name) {
      var row = document.createElement("div");
      row.className = "member";
      var admin = isAdmin(name);
      row.innerHTML =
        '<span class="dot" style="background:' + colorFor(name) + '">' + escapeHtml(name.charAt(0).toUpperCase()) + '</span>' +
        '<span class="mname">' + escapeHtml(name) + '</span>' +
        '<button class="roletoggle' + (admin ? ' on' : '') + '" title="Toggle admin">' + (admin ? "Admin" : "Member") + '</button>' +
        '<button class="del" title="Remove">×</button>';
      row.querySelector(".roletoggle").onclick = function () { toggleAdmin(name); };
      row.querySelector(".del").onclick = function () {
        if (isAdmin(name) && admins().length <= 1) { showToast("Can't remove the last admin"); return; }
        showConfirm({ title: "Remove " + name + "?", msg: "Their logged entries stay, but they can no longer sign in.", ok: "Remove" }, function () {
          var idx = members().indexOf(name);
          var wasAdmin = isAdmin(name);
          commitRoster(function () {
            cache.members = members().filter(function (n) { return n !== name; });
            if (wasAdmin) cache.admins = admins().filter(function (n) { return n.toLowerCase() !== name.toLowerCase(); });
          }, name + " removed", function () {
            commitRoster(function () {
              var l = members();
              if (l.indexOf(name) < 0) l.splice(Math.min(idx < 0 ? l.length : idx, l.length), 0, name);
              cache.members = l;
              if (wasAdmin) { var a = admins(); if (a.map(function (n) { return n.toLowerCase(); }).indexOf(name.toLowerCase()) < 0) a.push(name); cache.admins = a; }
            }, null, null);
          });
        });
      };
      el.appendChild(row);
    });
  }

  document.getElementById("addMemberBtn").onclick = function () {
    var input = document.getElementById("newMember");
    var err = document.getElementById("memberErr");
    var name = input.value.trim();
    err.textContent = "";
    if (!name) { err.textContent = "Enter a name."; return; }
    if (!/^[A-Za-z][A-Za-z0-9 _-]{0,23}$/.test(name)) { err.textContent = "Use letters/numbers, 1-24 chars, starting with a letter."; return; }
    if (members().some(function (n) { return n.toLowerCase() === name.toLowerCase(); })) {
      err.textContent = "That name already exists."; return;
    }
    input.value = "";
    commitRoster(function () { cache.members = members().concat([name]); }, name + " added", null);
  };
  document.getElementById("newMember").addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("addMemberBtn").click();
  });

  // ---- Data store: Firestore only ----
  var Store = (function () {
    var fb = null;
    var didSeed = false;

    function emitEntries(arr) { state.entries = arr; renderAll(); }
    function emitRoster(m, a) {
      if (m && m.length) cache.members = m;
      if (a && a.length) cache.admins = a;
      rosterLoaded = true;
      renderAll();
      if (document.getElementById("tab-admin").classList.contains("active")) renderMembers();
      if (state.me) { refreshAdminAccess(); }
      else {
        // roster is now authoritative - resume a saved session that the default list couldn't match yet
        var saved = localStorage.getItem(SESSION_KEY);
        if (saved && resolveName(saved)) doLogin(resolveName(saved), localStorage.getItem(ADMINSESS_KEY) === "1");
      }
    }

    function fbStart() {
      fb.onSnapshot(fb.collection(fb.db, "entries"), function (snap) {
        if (!snap.metadata.fromCache) netReady = true;
        var arr = [];
        snap.forEach(function (d) { var v = d.data(); arr.push({ id: d.id, who: v.who, date: v.date, mins: v.mins, note: v.note || "" }); });
        emitEntries(arr);
      }, function (err) { console.error("entries listener:", err); });

      var rosterRef = fb.doc(fb.db, "meta", "roster");
      fb.onSnapshot(rosterRef, function (d) {
        if (!d.metadata.fromCache) netReady = true;
        if (d.exists()) {
          var v = d.data();
          emitRoster(v.members || DEFAULT_MEMBERS.slice(), v.admins || DEFAULT_ADMINS.slice());
        } else if (!didSeed && !d.metadata.fromCache) {
          // first run ever: seed roster + demo entries into Firestore (only once, only from the server)
          didSeed = true;
          fb.setDoc(rosterRef, { members: DEFAULT_MEMBERS.slice(), admins: DEFAULT_ADMINS.slice() });
          seedData().forEach(function (en) {
            fb.setDoc(fb.doc(fb.db, "entries", en.id), { who: en.who, date: en.date, mins: en.mins, note: en.note || "" });
          });
        }
      }, function (err) { console.error("roster listener:", err); });

      fb.onSnapshot(fb.collection(fb.db, "challenges"), function (snap) {
        var next = {};
        snap.forEach(function (d) { var v = d.data(); next[d.id] = (v && v.participants) ? v.participants : []; });
        challengesCache = next;
        renderAll();
      }, function (err) { console.error("challenges listener:", err); });
    }

    return {
      init: function (f) { fb = f; },
      start: function () { if (fb) fbStart(); },
      addEntry: function (obj) {
        var id = obj.id || uid();
        return fb.setDoc(fb.doc(fb.db, "entries", id), { who: obj.who, date: obj.date, mins: obj.mins, note: obj.note || "" }).then(function () { return id; });
      },
      updateEntry: function (id, fields) {
        return fb.updateDoc(fb.doc(fb.db, "entries", id), fields);
      },
      deleteEntry: function (id) {
        return fb.deleteDoc(fb.doc(fb.db, "entries", id));
      },
      putEntry: function (obj) {
        return fb.setDoc(fb.doc(fb.db, "entries", obj.id), { who: obj.who, date: obj.date, mins: obj.mins, note: obj.note || "" });
      },
      saveRoster: function () {
        return fb.setDoc(fb.doc(fb.db, "meta", "roster"), { members: cache.members, admins: cache.admins });
      },
      saveChallenge: function (key, participants) {
        return fb.setDoc(fb.doc(fb.db, "challenges", key), { participants: participants });
      }
    };
  })();

  // ---- Theme + settings menu ----
  var THEME_KEY = "minutes-theme";
  function currentTheme() {
    return (document.documentElement.getAttribute("data-theme") === "light") ? "light" : "dark";
  }
  function applyTheme(name, persist) {
    var t = (name === "light") ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
    if (persist) { try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#14162b");
    if (state.me) renderChart();
  }
  function toggleMenu(force) {
    var m = document.getElementById("settingsMenu");
    var g = document.getElementById("gearBtn");
    var show = (force === undefined) ? !m.classList.contains("show") : force;
    m.classList.toggle("show", show);
    if (g) g.classList.toggle("open", show);
  }
  function initTheme() {
    applyTheme(currentTheme(), false);
    var ver = document.getElementById("menuVer");
    if (ver) ver.textContent = "v" + VERSION;
    var gear = document.getElementById("gearBtn");
    if (gear) gear.addEventListener("click", function (e) { e.stopPropagation(); toggleMenu(); });
    document.querySelectorAll(".tt-opt").forEach(function (b) {
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        applyTheme(b.getAttribute("data-theme-choice"), true);
      });
    });
    var ml = document.getElementById("menuLogout");
    if (ml) ml.addEventListener("click", function () { toggleMenu(false); doLogout(); });
    document.addEventListener("click", function (e) {
      var m = document.getElementById("settingsMenu");
      var g = document.getElementById("gearBtn");
      if (m.classList.contains("show") && !m.contains(e.target) && (!g || !g.contains(e.target))) toggleMenu(false);
    });
  }

  // ---- Boot ----
  function begin() {
    initTheme();
    var av = document.querySelectorAll(".ver-tag");
    av.forEach(function (el) { el.textContent = "v" + VERSION; });
    console.log("Minutes v" + VERSION);
    if (window.__FB) Store.init(window.__FB);
    Store.start();
    // If we never receive real server data, warn once (viewing works, saving is blocked).
    setTimeout(function () {
      if (!netReady) showToast("Not connected. You can view, but changes won\u2019t save until you reconnect.", null);
    }, 5000);
    var saved = localStorage.getItem(SESSION_KEY);
    if (saved && resolveName(saved)) doLogin(resolveName(saved), localStorage.getItem(ADMINSESS_KEY) === "1");
  }
  var began = false;
  function tryBegin() { if (began) return; began = true; begin(); }
  if (window.__FB) { tryBegin(); }
  else {
    window.addEventListener("minutes-fb-ready", tryBegin);
    setTimeout(tryBegin, 6000); // fall back to localStorage if Firebase never loads
  }
})();
</script>
